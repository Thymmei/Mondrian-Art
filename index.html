<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    body {
      background-color: white;
    }

    .flex-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200vh;
    }

    .container {
      width: 748px;
      height: 748px;
      background-color: black;
      margin: 0;
      padding: 0;

      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
      gap: 9px;
    }

    .red-box {
      height: 414px;
      width: 320px;
      background-color: #E72F24;

      grid-area: 1 / 1 / 2 / 2;
    }

    .white-box-one {
      height: 414px;
      width: 419px;
      background-color: #F0F1EC;

      grid-area: 1 / 2 / 2 / 5;
    }

    .white-box-two {
      height: 296px;
      width: 320px;
      background-color: #F0F1EC;

      grid-area: 2 / 1 / 4 / 2;
    }

    .white-box-three {
      height: 296px;
      width: 360px;
      background-color: #F0F1EC;

      grid-area: 2 / 2 / 4 / 4;
    }

    .blue-box {
      height: 130px;
      width: 50px;
      background-color: #004592;
      border-bottom: 10px solid black;

      grid-area: 2 / 4 / 3 / 5;
    }

    .white-box-four {
      height: 183px;
      width: 50px;
      background-color: #F0F1EC;

      grid-area: 3 / 4 / 5 / 5;
    }

    .white-box-five {
      height: 20px;
      width: 320px;
      background-color: #F0F1EC;

      grid-area: 4 / 1 / 5 / 2;
    }

    .yellow-box {
      height: 20px;
      width: 198px;
      background-color: #F9D01E;

      grid-area: 4 / 2 / 5 / 3;
    }

    .black-box {
      height: 20px;
      width: 153px;
      background-color: #232629;

      grid-area: 4 / 3 / 5 / 4;
    }



  </style>
</head>

<div class="flex-container">
  <body>
  <!-- Write your HTML here -->
  <div class="container">
    <div class="red-box"></div>
    <div class="white-box-one"></div>
    <div class="white-box-two"></div>
    <div class="white-box-three"></div>
    <div class="blue-box"></div>
    <div class="white-box-four"></div>
    <div class="white-box-five"></div>
    <div class="yellow-box"></div>
    <div class="black-box"></div>
  </div>
</body> 
</div>

</html>
